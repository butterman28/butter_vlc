name: Build VLC AppImage

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y \
            build-essential git meson cmake ninja-build autoconf automake libtool pkg-config \
            libvlccore-dev qtbase5-dev qttools5-dev-tools liblua5.3-dev \
            libgcrypt20-dev libdbus-1-dev libxml2-dev wget curl libavcodec-dev libavformat-dev libswscale-dev

      - name: Bootstrap and Configure
        run: |
          ./bootstrap
          mkdir -p build && cd build
          ../configure --prefix=/usr --disable-update-check

      - name: Compile and Stage
        run: |
          cd build
          make -j$(nproc)
          make DESTDIR=$(pwd)/appdir install

      - name: Bundle into AppImage
        run: |
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # Set up minimal AppDir structure wrapper pointers if necessary
          # and generate the image artifact
          ./appimagetool-x86_64.AppImage build/appdir VLC-Custom-x86_64.AppImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlc-appimage
          path: VLC-Custom-x86_64.AppImage
