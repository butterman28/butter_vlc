name: Build VLC AppImage

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install All VLC Build Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
      
          # Enable deb-src lines without removing the deb lines
          sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list
      
          apt-get update
      
          # Install every Build-Depends declared by the vlc source package
          apt-get build-dep -y vlc
      
          # Install any extra tooling not covered by Build-Depends
          apt-get install -y build-essential git wget curl libxcb-xkb-dev
      - name: Bootstrap and Configure
        run: |
          ./bootstrap
          mkdir -p build && cd build
          ../configure --prefix=/usr --disable-update-check

      - name: Compile and Stage
        run: |
          cd build
          make -j$(nproc)
          make DESTDIR=$(pwd)/appdir install

      - name: Bundle into AppImage
        run: |
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # Set up minimal AppDir structure wrapper pointers if necessary
          # and generate the image artifact
          ./appimagetool-x86_64.AppImage build/appdir VLC-Custom-x86_64.AppImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlc-appimage
          path: VLC-Custom-x86_64.AppImage
