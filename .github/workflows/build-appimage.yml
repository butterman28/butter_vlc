name: Build VLC AppImage

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install All VLC Build Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          
          # 1. Enable source repositories (deb-src) in a robust way
          #    This adds source entries for all existing binary repositories.
          sed -i 's/^deb /deb-src /' /etc/apt/sources.list
          apt-get update
          
          # 2. Let apt install every Build-Depends listed in the VLC package
          apt-get build-dep -y vlc
          
          # 3. Install essential build tools that may not be in Build-Depends
          apt-get install -y \
            build-essential git wget curl \
            devscripts equivs  # helpful for fallback and packaging
      - name: Bootstrap and Configure
        run: |
          ./bootstrap
          mkdir -p build && cd build
          ../configure --prefix=/usr --disable-update-check

      - name: Compile and Stage
        run: |
          cd build
          make -j$(nproc)
          make DESTDIR=$(pwd)/appdir install

      - name: Bundle into AppImage
        run: |
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # Set up minimal AppDir structure wrapper pointers if necessary
          # and generate the image artifact
          ./appimagetool-x86_64.AppImage build/appdir VLC-Custom-x86_64.AppImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlc-appimage
          path: VLC-Custom-x86_64.AppImage
